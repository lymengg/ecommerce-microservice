spring:
  application:
    name: checkout-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8087/realms/ecommerce}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  # trace_id/span_id are put into the SLF4J MDC by the OpenTelemetry Java agent's
  # Logback instrumentation — that is what lets a log line be joined to its trace
  # (doc 08 §5). correlationId is added by the correlation filter, and stays
  # empty until a request carries one.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [trace=%X{trace_id:-},span=%X{span_id:-},corr=%X{correlationId:-}] %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8086}

ecommerce:
  # Phase 7 resilience (ADR-017/018). Only the numbers that differ from the
  # shared defaults in ResilienceProperties are listed; the budget arithmetic
  # lives in ADR-018.
  resilience:
    # Overall wall-clock budget for one checkout. Each call's response timeout
    # is additionally capped at whatever is left of it, so the saga cannot
    # overrun by a whole socket timeout.
    saga-budget: ${SAGA_BUDGET:10s}
    dependencies:
      cart:
        # A single indexed read, and the cart is closed with a state write.
        response-timeout: 1s
      order:
        # Slowest dependency: creating an order re-prices every line from
        # catalog-service, so its own budget must fit inside this one.
        response-timeout: 3s
      inventory:
        response-timeout: 1500ms
      payment:
        # Payment initiation calls order-service and the provider.
        response-timeout: 3s
  cart:
    base-url: ${CART_SERVICE_URL:http://localhost:8082}
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8084}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  security:
    service-client:
      enabled: true
      token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8087/realms/ecommerce/protocol/openid-connect/token}
      client-id: ${SERVICE_CLIENT_ID:service-client}
      client-secret: ${SERVICE_CLIENT_SECRET:dev-service-client-secret}
