spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_payment}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # Event backbone (Phase 6, ADR-004). payment-service is a producer only:
  # its outbox is drained to payment.events, where order-service consumes
  # PaymentSucceeded / PaymentFailed.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8087/realms/ecommerce}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  # trace_id/span_id are put into the SLF4J MDC by the OpenTelemetry Java agent's
  # Logback instrumentation — that is what lets a log line be joined to its trace
  # (doc 08 §5). correlationId is added by the correlation filter, and stays
  # empty until a request carries one.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [trace=%X{trace_id:-},span=%X{span_id:-},corr=%X{correlationId:-}] %logger{36} - %msg%n"

# Observability (Phase 8, ADR-021). The scrape endpoint and the probes are
# exposed; everything else under /actuator is not, and the security chain
# permits only these. show-details is `never` because the health endpoint is
# unauthenticated — a health check must not leak database or disk detail to
# anyone who can reach the port.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # doc 08 §8: readiness must mean "this instance can receive traffic",
        # not merely "the application context finished starting". A service whose
        # database is unreachable can answer nothing useful, so it should be
        # taken out of rotation rather than serve errors — liveness deliberately
        # does NOT include db, because restarting a service cannot fix a database
        # outage and would only remove the instances that could recover.
        readiness:
          include: readinessState,db
  metrics:
    tags:
      environment: ${ENVIRONMENT:local}
    distribution:
      # Prometheus histogram buckets for the HTTP timer, so p95 can be computed
      # with histogram_quantile. Without this Micrometer exports only count/sum/max
      # and any percentile alert is impossible to write. Client-side percentiles
      # are deliberately not used: a per-instance quantile cannot be aggregated
      # across instances, which is exactly what an SLO needs to be.
      percentiles-histogram:
        http.server.requests: true

server:
  port: ${SERVER_PORT:8085}

ecommerce:
  payment:
    decline-above: ${DECLINE_ABOVE:10000}
    # Phase 8: the mock provider's latency knob, used to degrade the system on
    # purpose (an SLO is only meaningful once you have watched it burn). Zero by
    # default; see the observability baseline in docs/.
    provider-delay: ${PAYMENT_PROVIDER_DELAY:0s}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
  # Phase 7 resilience (ADR-018): initiation calls order-service to read the
  # authoritative order total, so the order budget must fit inside this one.
  resilience:
    dependencies:
      order:
        response-timeout: 3s
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8084}
  security:
    # Provider webhook callbacks carry signatures, not OAuth2 tokens (mock
    # provider: none yet). The endpoint is rate-limited at the edge and the
    # provider is allowlisted in PaymentController.
    permit-all:
      - "POST:/api/v1/payments/webhooks/**"
    service-client:
      enabled: true
      token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8087/realms/ecommerce/protocol/openid-connect/token}
      client-id: ${SERVICE_CLIENT_ID:service-client}
      client-secret: ${SERVICE_CLIENT_SECRET:dev-service-client-secret}
