server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm metadata endpoint; JWKS are resolved from it.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8087/realms/ecommerce}
  cloud:
    gateway:
      server:
        webflux:
          # Phase 7 (ADR-018): the edge gets timeouts and a bounded connection
          # pool, but deliberately no retry filter and no circuit breaker.
          # Resilience belongs at the service boundary, where the policy is
          # per-dependency; retrying here as well would double-retry the same
          # request at two layers (see ADR-017 §"why not at the edge").
          #
          # The response timeout is the outermost bound of the timeout budget:
          # it must exceed the saga budget (ecommerce.resilience.saga-budget,
          # default 10s) so a saga that is legitimately compensating is not cut
          # off mid-flight at the edge.
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:15s}
            pool:
              max-connections: ${GATEWAY_MAX_CONNECTIONS:200}
              acquire-timeout: ${GATEWAY_ACQUIRE_TIMEOUT_MS:1000}
          routes:
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/products/**
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/cart/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/orders/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/payments/**
            - id: checkout-service
              uri: ${CHECKOUT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/checkout/**
      globalcors:
        cors-configurations:
          '[/**]':
            # Explicit allowlist only — never wildcard for authenticated APIs.
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowed-methods: [GET, POST, PATCH, DELETE, OPTIONS]
            allowed-headers: [Authorization, Content-Type, Idempotency-Key]
            exposed-headers: [Idempotency-Key]
            allow-credentials: false
            max-age: 3600

logging:
  # trace_id/span_id are put into the SLF4J MDC by the OpenTelemetry Java agent's
  # Logback instrumentation — that is what lets a log line be joined to its trace
  # (doc 08 §5). correlationId is added by CorrelationIdFilter.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [trace=%X{trace_id:-},span=%X{span_id:-},corr=%X{correlationId:-}] %logger{36} - %msg%n"

ecommerce:
  gateway:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      # coarse-grained fixed-window limit per client IP; Redis-backed limiting
      # arrives with the Phase 8 infrastructure
      max-requests-per-minute: ${RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:100}
      # stricter limit for sensitive business flows (checkout, payment
      # initiation), keyed by the authenticated subject when available
      strict:
        max-requests-per-minute: ${STRICT_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:10}
