spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # no issuer-uri: the JwtDecoder is @Lazy and only created when a
          # real bearer token needs validating; tests use mocked JWTs or
          # override this property (GatewayKeycloakIT)
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: http://localhost:18080
              predicates:
                - Path=/api/v1/products/**
            - id: cart-service
              uri: http://localhost:18080
              predicates:
                - Path=/api/v1/cart/**
            - id: order-service
              uri: http://localhost:18080
              predicates:
                - Path=/api/v1/orders/**
            - id: payment-service
              uri: http://localhost:18080
              predicates:
                - Path=/api/v1/payments/**
            - id: checkout-service
              uri: http://localhost:18080
              predicates:
                - Path=/api/v1/checkout/**

ecommerce:
  gateway:
    rate-limit:
      enabled: true
      max-requests-per-minute: 1000
