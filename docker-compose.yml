# Local development infrastructure — the whole environment (Phase 8, ADR-021).
#
# Usage:
#   docker compose up -d
#   # then start the seven services with DB_PORT=5433 (see README)
#
# Postgres is here as of Phase 8. It used to be a `docker run` plus a `docker
# exec psql -c "CREATE DATABASE ..."` in the README, which is exactly the kind of
# setup step that gets skipped, mistyped, or forgotten on a new machine. It is on
# host port 5433 because 5432 is often taken by a local Windows PostgreSQL, and
# the databases are created by infra/postgres/init-databases.sql on first start.
#
# The observability stack (Phase 8):
#   Prometheus  :9090   metrics + alert evaluation
#   Grafana     :3000   dashboards (metrics, logs, traces in one place)
#   Loki        :3100   logs, ingested over OTLP via the collector
#   Jaeger      :16686  traces (Phase 5)
#
# Telemetry topology: services -> OTLP -> otel-collector -> Jaeger (traces) and
# -> Loki (logs); metrics are pulled from each service's /actuator/prometheus.
# The collector stays the single ingestion point, which is what keeps the trace
# and log backends swappable without touching a service.
#
# Kafka (Phase 6, ADR-004): the event backbone. Domain events published from
# each service's transactional outbox land here; consumers (order, inventory)
# subscribe. See docs/06-event-kafka-specification.md.
services:
  # One database per service (ADR-003/011). Separate databases make "no
  # cross-service SQL" a physical fact rather than a convention.
  postgres:
    image: postgres:16-alpine
    # 5433, not 5432: the host's own PostgreSQL usually holds 5432.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Kafka in KRaft mode — no ZooKeeper. KRaft became production-ready in Kafka
  # 3.3 and is the only mode from Kafka 4.x, so running ZooKeeper would be
  # learning a component the industry has already removed. Single node acting
  # as both broker and controller is the correct shape for local development;
  # production runs 3+ brokers and 3 controllers.
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # The address clients are told to use after connecting. It must be
      # resolvable from the host (our services run outside the container), so
      # it is localhost:9092 — not the container hostname.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Replication factors of 1 because there is a single broker. A real
      # cluster uses 3 so it survives a broker loss.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the application (KafkaAdmin + NewTopic beans),
      # so a typo fails loudly instead of silently creating a topic with
      # default settings. Auto-creation hides configuration mistakes.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    # Keycloak 26 serves health on the *management* port 9000, not the main HTTP
    # port. Probing 8080 returns 404, so the healthcheck below would never pass
    # and the container would report unhealthy forever while serving normally.
    # --health-enabled makes that endpoint explicit.
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8087:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Jaeger v2 — trace storage and UI. The image defaults to an all-in-one
  # process with transient in-memory storage, so no config file is needed.
  # Only the UI port is published: OTLP ingestion is the collector's job, and
  # a single ingestion point is what keeps the backend swappable (Phase 8
  # replaces this with Tempo without any service change).
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686"

  # OpenTelemetry Collector — the single ingestion point for all telemetry.
  # Ports are bound to 127.0.0.1 so only this machine can inject spans; the
  # defaults (0.0.0.0) would expose ingestion to the whole network.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"    # OTLP/gRPC — used by the Java agent
      - "127.0.0.1:4318:4318"    # OTLP/HTTP — curl and manual debugging
      - "127.0.0.1:13133:13133"  # health_check extension
      - "127.0.0.1:8888:8888"    # collector self-metrics, scraped by Prometheus
    depends_on:
      - jaeger
      - loki

  # Prometheus (Phase 8, ADR-021): metric storage and the alert evaluator.
  # Alerts are evaluated here and visible at /alerts and /api/v1/alerts; there is
  # deliberately no Alertmanager — in development there is nowhere to route a
  # notification, and the thing worth testing is the *rule*, not the routing.
  # Routing belongs with the production stack (Phase 10).
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # The services run on the host in development, so Prometheus needs a route
    # back out of the container. host-gateway is what makes that work on Linux
    # too; Docker Desktop already provides host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Loki (Phase 8, ADR-021): logs, ingested over OTLP from the collector.
  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  # Grafana (Phase 8, ADR-021): the one place to look. Prometheus, Loki and
  # Jaeger are all provisioned as datasources, so a slow checkout can be seen as
  # a metric, read as a log, and opened as a trace without leaving the tab.
  # Datasources and dashboards are provisioned from files, not clicked in — a
  # dashboard that only exists in someone's browser is not documentation.
  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Development convenience: no login wall in front of local dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
