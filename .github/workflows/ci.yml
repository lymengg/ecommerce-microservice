name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast feedback: unit tests only, no Docker required.
  unit-tests:
    name: Unit tests (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests
        run: ./mvnw -B --no-transfer-progress test

  # Full verification: reactor build + integration tests. The ITs run against
  # Testcontainers PostgreSQL and a real Keycloak container, so this job needs
  # Docker — available natively on ubuntu-latest (no docker-in-docker needed).
  integration-tests:
    name: Integration tests (Testcontainers + Docker)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Warm up Testcontainers images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.4
          docker pull postgres:16-alpine

      - name: Build and verify (Docker)
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
          retention-days: 7
