spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_inventory}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # Event backbone (Phase 6, ADR-004). inventory-service produces
  # InventoryReserved/Released/Committed/Expired and consumes order.events to
  # commit a reservation once the order is confirmed.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8087/realms/ecommerce}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  # trace_id/span_id are put into the SLF4J MDC by the OpenTelemetry Java agent's
  # Logback instrumentation — that is what lets a log line be joined to its trace
  # (doc 08 §5). correlationId is added by the correlation filter, and stays
  # empty until a request carries one.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [trace=%X{trace_id:-},span=%X{span_id:-},corr=%X{correlationId:-}] %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8083}

ecommerce:
  inventory:
    reservation-ttl: ${RESERVATION_TTL:PT30M}
    expiry-interval-ms: ${EXPIRY_INTERVAL_MS:60000}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
