spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_order}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # Event backbone (Phase 6, ADR-004). String serializers because the wire
  # format is our own JSON envelope (doc 06 §1), serialized explicitly in the
  # publisher — that keeps the contract visible in code rather than hidden in a
  # serializer configuration.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # all: the send is acknowledged only once every in-sync replica has it,
      # so a broker failure right after ack cannot lose the event.
      acks: all
    consumer:
      # Each capability gets its own group (doc 06 §10); listeners override this
      # explicitly, so the default only matters if one forgets.
      group-id: ${spring.application.name}
      # A brand-new consumer group starts from the beginning rather than
      # missing events that were published before it first ran.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Commit the offset after each record, so the at-least-once window is one
      # record wide — combined with idempotent consumers that is enough.
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8087/realms/ecommerce}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  # trace_id/span_id are put into the SLF4J MDC by the OpenTelemetry Java agent's
  # Logback instrumentation — that is what lets a log line be joined to its trace
  # (doc 08 §5). correlationId is added by the correlation filter, and stays
  # empty until a request carries one.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [trace=%X{trace_id:-},span=%X{span_id:-},corr=%X{correlationId:-}] %logger{36} - %msg%n"

# Observability (Phase 8, ADR-021). The scrape endpoint and the probes are
# exposed; everything else under /actuator is not, and the security chain
# permits only these. show-details is `never` because the health endpoint is
# unauthenticated — a health check must not leak database or disk detail to
# anyone who can reach the port.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # doc 08 §8: readiness must mean "this instance can receive traffic",
        # not merely "the application context finished starting". A service whose
        # database is unreachable can answer nothing useful, so it should be
        # taken out of rotation rather than serve errors — liveness deliberately
        # does NOT include db, because restarting a service cannot fix a database
        # outage and would only remove the instances that could recover.
        readiness:
          include: readinessState,db
  metrics:
    tags:
      environment: ${ENVIRONMENT:local}
    distribution:
      # Prometheus histogram buckets for the HTTP timer, so p95 can be computed
      # with histogram_quantile. Without this Micrometer exports only count/sum/max
      # and any percentile alert is impossible to write. Client-side percentiles
      # are deliberately not used: a per-instance quantile cannot be aggregated
      # across instances, which is exactly what an SLO needs to be.
      percentiles-histogram:
        http.server.requests: true

server:
  port: ${SERVER_PORT:8084}

ecommerce:
  tax-rate: ${TAX_RATE:0.10}
  # Phase 8: this service consumes payment.events, so its consumer lag is a real
  # signal. See the flag's comment in common's ObservabilityAutoConfiguration for
  # why it is off by default.
  metrics:
    kafka-lag:
      enabled: true
  # Phase 7 resilience (ADR-017/018). Per-dependency response timeouts only;
  # everything else uses the shared defaults.
  resilience:
    dependencies:
      catalog:
        # Called once per order line, so it must be the cheapest of the three.
        response-timeout: 1s
      payment:
        response-timeout: 3s
      inventory:
        response-timeout: 1500ms
  # Phase 7 reconciliation (ADR-020): find and repair orders a partial saga
  # failure stranded. stale-after must stay below inventory's reservation TTL
  # (PT30M) or stock would expire before the job could release it on purpose.
  reconciliation:
    enabled: ${RECONCILIATION_ENABLED:true}
    interval-ms: ${RECONCILIATION_INTERVAL_MS:60000}
    initial-delay-ms: ${RECONCILIATION_INITIAL_DELAY_MS:30000}
    stale-after: ${RECONCILIATION_STALE_AFTER:10m}
    batch-size: ${RECONCILIATION_BATCH_SIZE:50}
    lease: ${RECONCILIATION_LEASE:2m}
    max-attempts: ${RECONCILIATION_MAX_ATTEMPTS:5}
    retry-backoff: ${RECONCILIATION_RETRY_BACKOFF:5m}
  outbox:
    # How often the publisher drains outbox_events to Kafka (ADR-009/015).
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    # Bounds the row lock held per publish cycle.
    batch-size: ${OUTBOX_BATCH_SIZE:100}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  # Read-only, for the reconciliation job (ADR-020): order-service asks the
  # owning services for authoritative state instead of reading their tables.
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
  security:
    service-client:
      enabled: true
      token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8087/realms/ecommerce/protocol/openid-connect/token}
      client-id: ${SERVICE_CLIENT_ID:service-client}
      client-secret: ${SERVICE_CLIENT_SECRET:dev-service-client-secret}
