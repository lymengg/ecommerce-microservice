spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_order}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # Event backbone (Phase 6, ADR-004). String serializers because the wire
  # format is our own JSON envelope (doc 06 §1), serialized explicitly in the
  # publisher — that keeps the contract visible in code rather than hidden in a
  # serializer configuration.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # all: the send is acknowledged only once every in-sync replica has it,
      # so a broker failure right after ack cannot lose the event.
      acks: all
    consumer:
      # Each capability gets its own group (doc 06 §10); listeners override this
      # explicitly, so the default only matters if one forgets.
      group-id: ${spring.application.name}
      # A brand-new consumer group starts from the beginning rather than
      # missing events that were published before it first ran.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Commit the offset after each record, so the at-least-once window is one
      # record wide — combined with idempotent consumers that is enough.
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8087/realms/ecommerce}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  # trace_id/span_id are put into the SLF4J MDC by the OpenTelemetry Java agent's
  # Logback instrumentation — that is what lets a log line be joined to its trace
  # (doc 08 §5). correlationId is added by the correlation filter, and stays
  # empty until a request carries one.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [trace=%X{trace_id:-},span=%X{span_id:-},corr=%X{correlationId:-}] %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8084}

ecommerce:
  tax-rate: ${TAX_RATE:0.10}
  outbox:
    # How often the publisher drains outbox_events to Kafka (ADR-009/015).
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    # Bounds the row lock held per publish cycle.
    batch-size: ${OUTBOX_BATCH_SIZE:100}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  security:
    service-client:
      enabled: true
      token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8087/realms/ecommerce/protocol/openid-connect/token}
      client-id: ${SERVICE_CLIENT_ID:service-client}
      client-secret: ${SERVICE_CLIENT_SECRET:dev-service-client-secret}
